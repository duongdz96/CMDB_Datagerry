version: '3'

services:
  mongodb:
    image: mongo:latest
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"  # Port cho giao diện quản lý RabbitMQ (tùy chọn)

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
      - rabbitmq

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes: 
      - ./app:/app
      - /app/node_modules 
    depends_on:
      - backend

volumes:
  mongo-data:
